# Netlify Configuration for Library Hub Nawalpur
# Monorepo setup: Frontend lives in the `frontend` subfolder

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA Routing: Redirect all routes to /index.html with status 200
# Ensures direct visits to /about, /facilities, /membership, /gallery, etc. don't 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control for Vite hashed static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

